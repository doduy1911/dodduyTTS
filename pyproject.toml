[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doduytts"
version = "0.2.1"
description = "DoDuyTTS: Towards Omnilingual Zero-Shot Text-to-Speech with Diffusion Language Models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Han Zhu"}]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "zero-shot",
    "multilingual",
    "diffusion",
    "voice-cloning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "accelerate",
    "pydub",
    "gradio",
    "tensorboardX",
    "webdataset",
    "numpy",
    "soundfile",
    "librosa",
    "websockets>=16.1.1",
]

[project.optional-dependencies]

tn = [
    "WeTextProcessing",   # zh/en text normalization (numbers, dates, currency)
    "num2words",           # integer-to-words fallback for other languages
]

eval = [
    "jiwer==3.1.0",       # WER
    "s3prl",               # Speech representation (HuBERT etc.)
    "funasr",              # ASR models
    "zhconv",              # Chinese character normalization
    "zhon",                # Chinese punctuation
    "unidecode",            # Unicode normalization
]

lora = [
    "peft>=0.20.0",       # LoRA fine-tuning support
]

[project.scripts]
doduytts-infer = "doduytts.cli.infer:main"
doduytts-infer-batch = "doduytts.cli.infer_batch:main"
doduytts-demo = "doduytts.cli.demo:main"
doduytts-merge-lora = "doduytts.cli.merge_lora:main"
doduytts-serve = "doduytts.server.app:main"

[project.urls]
Homepage = "https://github.com/doduy1911/dodduyTTS"
Repository = "https://github.com/doduy1911/dodduyTTS"
"Bug Tracker" = "https://github.com/doduy1911/dodduyTTS/issues"

[tool.uv.sources]
# Install PyTorch with CUDA support on Linux/Windows (CUDA doesn't exist for Mac).
# NOTE: We must explicitly request them as `dependencies` above. These improved
# versions will not be selected if they're only third-party dependencies.
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
# Use PyTorch built for NVIDIA Toolkit version 12.8.
# Available versions: https://pytorch.org/get-started/locally/
url = "https://download.pytorch.org/whl/cu128"
# Only use this index when explicitly requested by `tool.uv.sources`.
explicit = true

[tool.uv]
constraint-dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[tool.ruff.lint]
ignore = ["F401", "E402", "F403", "F841", "E741"]

[tool.hatch.build.targets.sdist]
include = ["doduytts"]

[tool.hatch.build.targets.wheel]
packages = ["doduytts"]
